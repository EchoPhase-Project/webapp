# Release: pushes to main and manual runs (UI "Run pipeline", `mise run ci:run`)
# publish this commit's webapp image to the in-cluster registry and
# release the image by committing its tag to EchoPhase-Project/deploy (Flux
# deploys from there).
# GitHub Actions does the checks (all OSes); this only needs what GitHub
# cannot reach: the registry.
#
# Manual-run variables:
#   DEPLOY=false   publish only, do not touch the release
#
# The image is built by the cluster's BuildKit daemon (deploy:
# infra/woodpecker/buildkitd.yaml), which keeps its cache: the step is only a
# client and needs no privileges. Requires the secret deploy_key (write
# deploy key of EchoPhase-Project/deploy).

variables:
    # Step image: mise + the tools of mise.lock. `mise run ci:image` updates it.
    - &ci-image localhost:30500/echophase/ci-webapp:91ef4e9df280
    - &buildkit moby/buildkit:v0.33.0
    # From pipeline pods the registry is its Service; image references in the
    # chart keep localhost:30500, the address the node pulls from.
    - &registry registry.registry.svc:5000

when:
    - event: push
      branch: main
    - event: manual

# The clone is part of the image-tag step: one pod less (a step's pod start
# took 8-14 s of a clone whose fetch took ~1 s).
skip_clone: true

steps:
    - name: image-tag
      image: *ci-image
      commands:
          # Blobless: history and tags for `git describe` (the image tag), the
          # files of this commit only. The repository is public: no credentials.
          - git init -q -b main .
          - git config --global --add safe.directory "$${CI_WORKSPACE}"
          - git remote add origin "$${CI_REPO_CLONE_URL}"
          - git fetch -q --filter=blob:none --tags origin "+$${CI_COMMIT_SHA}:"
          - git checkout -q --detach "$${CI_COMMIT_SHA}"
          # Computed first, written after: a file created during the computation
          # would count as an uncommitted change and make the tag "-dirty".
          - TAG=$(mise run -q image-tag)
          - echo "$${TAG}" > .image-tag
          - echo "image tag $${TAG}"

    - name: webapp-image
      image: *buildkit
      depends_on: [image-tag]
      environment:
          REGISTRY: *registry
          BUILDKIT_HOST: tcp://buildkitd.woodpecker.svc:1234
      commands:
          # A new pod is allowed through buildkitd's NetworkPolicy a few seconds
          # after it starts (kube-router): wait for it, at most 10 s.
          - for i in $$(seq 1 10); do buildctl --addr $${BUILDKIT_HOST} debug workers >/dev/null 2>&1 && break; sleep 1; done
          - TAG=$(cat .image-tag)
          - IMAGE=$${REGISTRY}/echophase/webapp
          - >
              buildctl --addr $${BUILDKIT_HOST} build
              --frontend dockerfile.v0 --local context=. --local dockerfile=.
              --opt build-arg:ECHOPHASE_VERSION=$${TAG}
              --output "type=image,\"name=$${IMAGE}:$${TAG},$${IMAGE}:latest\",push=true,registry.insecure=true"
      backend_options:
          kubernetes:
              resources:
                  requests: { cpu: 100m, memory: 128Mi }
                  limits: { cpu: '1', memory: 512Mi }

    # GitOps: commit the tag to EchoPhase-Project/deploy; Flux upgrades the
    # release from there. The step has no rights in the cluster at all.
    - name: release
      image: *ci-image
      depends_on: [webapp-image]
      when:
          - evaluate: 'DEPLOY != "false"'
      environment:
          # Write deploy key of EchoPhase-Project/deploy (Woodpecker secret).
          DEPLOY_KEY:
              from_secret: deploy_key
          GIT_AUTHOR_NAME: Woodpecker CI
          GIT_AUTHOR_EMAIL: ci@echophase.invalid
          GIT_COMMITTER_NAME: Woodpecker CI
          GIT_COMMITTER_EMAIL: ci@echophase.invalid
      commands:
          - mise run release:push
