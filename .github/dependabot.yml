# Weekly, one grouped PR per ecosystem; minor and patch only for npm (major
# upgrades are done by hand).
version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
      groups:
          npm:
              patterns: ['*']
              update-types: [minor, patch]
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
      commit-message:
          prefix: 'build(deps)'

    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
      commit-message:
          prefix: 'ci(deps)'

    - package-ecosystem: docker
      directories: ['/', '/infra/ci']
      schedule:
          interval: weekly
      groups:
          docker:
              patterns: ['*']
      commit-message:
          prefix: 'build(deps)'
