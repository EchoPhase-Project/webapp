name: Tests

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']
    workflow_dispatch:

env:
    MISE_AUTO_INSTALL: 'false'

jobs:
    check:
        name: contract, types, build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # Codecov upload with OIDC, no token
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up tools
              uses: jdx/mise-action@v5

            - name: Cache npm downloads
              uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              run: mise run install

            # schema.d.ts must match the contract named in ./api-version (GHCR).
            - name: Check
              run: mise run check

            - name: Coverage
              run: mise run test:coverage

            - name: Upload coverage to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@v7
              with:
                  use_oidc: true
                  files: artifacts/coverage/lcov.info
                  flags: webapp
                  fail_ci_if_error: false

    image:
        name: docker image
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Build the webapp image
              run: docker build -t webapp .
