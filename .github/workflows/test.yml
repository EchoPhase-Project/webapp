name: Tests

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']
    workflow_dispatch:

env:
    MISE_AUTO_INSTALL: 'false'

jobs:
    check:
        name: contract, types, build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up tools
              uses: jdx/mise-action@v5

            - name: Cache npm downloads
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              run: mise run install

            # schema.d.ts must match the contract named in ./api-version (GHCR).
            - name: Check
              run: mise run check

    image:
        name: docker image
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build the webapp image
              run: docker build -t webapp .
