name: Publish

# A tag vX.Y.Z publishes ghcr.io/echophase-project/webapp:X.Y.Z (and latest)
# for self-hosting; the chart in EchoPhase-Project/charts pins it by version.
on:
    push:
        tags: ['v*']

permissions:
    contents: read
    packages: write
    # Build provenance: signed with the workflow's OIDC identity, stored next to
    # the image in GHCR and listed under the org's linked artifacts.
    id-token: write
    attestations: write
    artifact-metadata: write

jobs:
    publish:
        runs-on: ubuntu-latest
        env:
            IMAGE: ghcr.io/echophase-project/webapp
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to GHCR
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            - name: Webapp image
              id: image
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  docker build -t "$IMAGE:$version" -t "$IMAGE:latest" .
                  docker push "$IMAGE:$version"
                  docker push "$IMAGE:latest"
                  digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$version")
                  echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

            - name: Webapp image provenance
              uses: actions/attest-build-provenance@v4
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.image.outputs.digest }}
                  push-to-registry: true
