name: Publish

# A tag vX.Y.Z publishes ghcr.io/echophase-project/webapp:X.Y.Z (and latest)
# for self-hosting; the chart in EchoPhase-Project/charts pins it by version.
# Then a GitHub release for the tag, its notes from the commits since the last
# one (scripts/release-notes.sh).
on:
    push:
        tags: ['v*']

permissions:
    # Write: the GitHub release.
    contents: write
    packages: write
    # Build provenance: signed with the workflow's OIDC identity, stored next to
    # the image in GHCR and listed under the org's linked artifacts.
    id-token: write
    attestations: write
    artifact-metadata: write

jobs:
    publish:
        runs-on: ubuntu-latest
        env:
            IMAGE: ghcr.io/echophase-project/webapp
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # The release notes read the commits since the previous tag.
                  fetch-depth: 0

            - name: Log in to GHCR
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            - name: Webapp image
              id: image
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  docker build --build-arg ECHOPHASE_VERSION="$version" -t "$IMAGE:$version" -t "$IMAGE:latest" .
                  docker push "$IMAGE:$version"
                  docker push "$IMAGE:latest"
                  digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$version")
                  echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

            - name: Webapp image provenance
              uses: actions/attest-build-provenance@v4
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.image.outputs.digest }}
                  push-to-registry: true

            - name: Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  {
                    scripts/release-notes.sh "$GITHUB_REF_NAME"
                    echo
                    echo "### Published"
                    echo
                    echo "- Image: \`$IMAGE:$version\`"
                    echo "- To run it: the Helm chart or Docker Compose in [charts](https://github.com/EchoPhase-Project/charts)."
                  } > release-notes.md
                  gh release create "$GITHUB_REF_NAME" --verify-tag \
                    --title "EchoPhase webapp $version" --notes-file release-notes.md
